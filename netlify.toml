[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  functions = "./functions"

[build.environment]
  NODE_VERSION = "18"

[dev]
  command = "npm run start"
  port = 8888
  targetPort = 8080
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
